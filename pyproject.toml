[project]
name = "agent-myla"
version = "0.1.0"
description = "An agentic LLM tutor that builds a personal, self-curated knowledge base."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Raktim Bora" }]

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Provider + tool deps
llm = [
    "langchain-anthropic>=0.2",
    "langchain-openai>=0.2",
    "litellm>=1.40",
]
tools = [
    "arxiv>=2.1",
    "youtube-transcript-api>=0.6",
    "sympy>=1.12",
    "numpy>=1.26",
]
app = [
    "chainlit>=1.1",
]

# Lints + tests
[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_myla"]

# ---------------------------------------------------------------------------
# Lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I isort, N pep8-naming, UP pyupgrade,
# B bugbear, SIM simplify, RUF ruff-specific, ANN annotations, ASYNC async checks.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # test functions don't need full type annotations

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# Tests + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"          # async tests need no @pytest.mark.asyncio decorator
testpaths = ["tests"]
addopts = "--cov=agent_myla --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/agent_myla"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true